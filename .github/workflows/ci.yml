name: CI Workflow

on:
  push:
    branches: [ "main" ] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install 

      - name: Set up Docker Image
        run: docker build -t my-web-app .

      - name: Prisma Validate
        run: npx prisma validate
        